[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-rubiks-cube"
version = "0.1.0"
description = "Reproducible connectome-constrained neural learning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
malecns = ["pyarrow>=16,<26"]

[project.scripts]
connectome-lab = "connectome_lab.cli:main"

[tool.setuptools.packages.find]
include = ["connectome_lab*"]

[tool.setuptools.package-data]
connectome_lab = ["assets/*.html"]
